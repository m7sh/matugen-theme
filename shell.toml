# Omarchy shell surfaces — Matugen Dynamic Theme
# Automatically generated by Matugen from the current wallpaper.

[bar]
background       = "#13140c"
background-alpha = 1.0
text             = "#e5e3d6"
active           = "#ffb3b3"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba(c5cc7a77) rgba(ffffff33) 45deg"
active-border-width      = 1
active-border-alpha      = 1.0
active-border-foreground = "rgba(c5cc7a77)"

[controls]
normal-color        = "#e5e3d6"
normal-fill-alpha   = 0.04
normal-border       = "#929182"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color        = "#e5e3d6"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "rgba(c5cc7a77)"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 1.0

focus-color        = "#e5e3d6"
focus-fill-alpha   = 0.08
focus-border       = "rgba(c5cc7a77)"
focus-border-width = 1
focus-border-alpha = 1.0

selected-color        = "#e5e3d6"
selected-fill-alpha   = 0.18
selected-border       = "rgba(c5cc7aaa)"
selected-border-width = 1
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#13140c"
background-alpha = 1.0
text             = "#e5e3d6"
border           = "hyprland.active-border"
border-width     = 1
border-alpha     = 1.0

[tooltip]
background       = "#13140c"
background-alpha = 0.97
text             = "#e5e3d6"
border           = "hyprland.active-border-foreground"
border-width     = 1
border-alpha     = 1.0

[notifications]
background       = "#13140c"
background-alpha = 1.0
text             = "#e5e3d6"
border           = "hyprland.active-border"
border-width     = 1
border-alpha     = 1.0
countdown        = "#c5cc7a"

[launcher]
background                = "#13140c"
background-alpha          = 0.95
text                      = "#e5e3d6"
border                    = "hyprland.active-border-foreground"
border-width              = 1
border-alpha              = 1.0
scrim                     = "#13140c"
scrim-alpha               = 0.5
selected-background       = "#e5e3d6"
selected-background-alpha = 0.08
selected-text             = "#c5cc7a"
selected-border           = "hyprland.active-border-foreground"
selected-border-width     = 1
selected-border-alpha     = 0.25

[menu]
background                = "#13140c"
background-alpha          = 1.0
text                      = "#e5e3d6"
border                    = "hyprland.active-border-foreground"
border-width              = 1
border-alpha              = 1.0
scrim                     = "#13140c"
scrim-alpha               = 0.5
selected-background       = "#e5e3d6"
selected-background-alpha = 0.08
selected-text             = "#c5cc7a"
selected-border           = "hyprland.active-border-foreground"
selected-border-width     = 1
selected-border-alpha     = 0.25

[polkit]
background       = "#13140c"
background-alpha = 1.0
text             = "#e5e3d6"
text-error       = "#ffb3b3"
border           = "hyprland.active-border"
border-width     = 1
border-error     = "#ffb3b3"
border-alpha     = 1.0
scrim            = "#13140c"
scrim-alpha      = 0.5
accent           = "#c5cc7a"

[lock]
background       = "#13140c"
background-alpha = 0.8
text             = "#e5e3d6"
placeholder      = "#929182"
text-error       = "#ffb3b3"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-width     = 1
border-error     = "#ffb3b3"
border-alpha     = 1.0
selection        = "#c5cc7a"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#13140c"
scrim-alpha             = 0.5
text                    = "#e5e3d6"
selected-border         = "#c5cc7a"
selected-border-alpha   = 1.0
unselected-border       = "#929182"
unselected-border-alpha = 0.28
