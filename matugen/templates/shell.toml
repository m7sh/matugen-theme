# Omarchy shell surfaces — Matugen Dynamic Theme
# Automatically generated by Matugen from the current wallpaper.

[bar]
background       = "{{ colors.background.default.hex }}"
background-alpha = 1.0
text             = "{{ colors.on_background.default.hex }}"
active           = "{{ colors.red.default.hex }}"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgba({{ colors.primary.default.hex_stripped }}77) rgba(ffffff33) 45deg"
active-border-width      = 1
active-border-alpha      = 1.0
active-border-foreground = "rgba({{ colors.primary.default.hex_stripped }}77)"

[controls]
normal-color        = "{{ colors.on_background.default.hex }}"
normal-fill-alpha   = 0.04
normal-border       = "{{ colors.outline.default.hex }}"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color        = "{{ colors.on_background.default.hex }}"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "rgba({{ colors.primary.default.hex_stripped }}77)"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 1.0

focus-color        = "{{ colors.on_background.default.hex }}"
focus-fill-alpha   = 0.08
focus-border       = "rgba({{ colors.primary.default.hex_stripped }}77)"
focus-border-width = 1
focus-border-alpha = 1.0

selected-color        = "{{ colors.on_background.default.hex }}"
selected-fill-alpha   = 0.18
selected-border       = "rgba({{ colors.primary.default.hex_stripped }}aa)"
selected-border-width = 1
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "{{ colors.background.default.hex }}"
background-alpha = 1.0
text             = "{{ colors.on_background.default.hex }}"
border           = "hyprland.active-border"
border-width     = 1
border-alpha     = 1.0

[tooltip]
background       = "{{ colors.background.default.hex }}"
background-alpha = 0.97
text             = "{{ colors.on_background.default.hex }}"
border           = "hyprland.active-border-foreground"
border-width     = 1
border-alpha     = 1.0

[notifications]
background       = "{{ colors.background.default.hex }}"
background-alpha = 1.0
text             = "{{ colors.on_background.default.hex }}"
border           = "hyprland.active-border"
border-width     = 1
border-alpha     = 1.0
countdown        = "{{ colors.primary.default.hex }}"

[launcher]
background                = "{{ colors.background.default.hex }}"
background-alpha          = 0.95
text                      = "{{ colors.on_background.default.hex }}"
border                    = "hyprland.active-border-foreground"
border-width              = 1
border-alpha              = 1.0
scrim                     = "{{ colors.background.default.hex }}"
scrim-alpha               = 0.5
selected-background       = "{{ colors.on_background.default.hex }}"
selected-background-alpha = 0.08
selected-text             = "{{ colors.primary.default.hex }}"
selected-border           = "hyprland.active-border-foreground"
selected-border-width     = 1
selected-border-alpha     = 0.25

[menu]
background                = "{{ colors.background.default.hex }}"
background-alpha          = 1.0
text                      = "{{ colors.on_background.default.hex }}"
border                    = "hyprland.active-border-foreground"
border-width              = 1
border-alpha              = 1.0
scrim                     = "{{ colors.background.default.hex }}"
scrim-alpha               = 0.5
selected-background       = "{{ colors.on_background.default.hex }}"
selected-background-alpha = 0.08
selected-text             = "{{ colors.primary.default.hex }}"
selected-border           = "hyprland.active-border-foreground"
selected-border-width     = 1
selected-border-alpha     = 0.25

[polkit]
background       = "{{ colors.background.default.hex }}"
background-alpha = 1.0
text             = "{{ colors.on_background.default.hex }}"
text-error       = "{{ colors.red.default.hex }}"
border           = "hyprland.active-border"
border-width     = 1
border-error     = "{{ colors.red.default.hex }}"
border-alpha     = 1.0
scrim            = "{{ colors.background.default.hex }}"
scrim-alpha      = 0.5
accent           = "{{ colors.primary.default.hex }}"

[lock]
background       = "{{ colors.background.default.hex }}"
background-alpha = 0.8
text             = "{{ colors.on_background.default.hex }}"
placeholder      = "{{ colors.outline.default.hex }}"
text-error       = "{{ colors.red.default.hex }}"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-width     = 1
border-error     = "{{ colors.red.default.hex }}"
border-alpha     = 1.0
selection        = "{{ colors.primary.default.hex }}"
selection-alpha  = 0.45

[image-picker]
scrim                   = "{{ colors.background.default.hex }}"
scrim-alpha             = 0.5
text                    = "{{ colors.on_background.default.hex }}"
selected-border         = "{{ colors.primary.default.hex }}"
selected-border-alpha   = 1.0
unselected-border       = "{{ colors.outline.default.hex }}"
unselected-border-alpha = 0.28
